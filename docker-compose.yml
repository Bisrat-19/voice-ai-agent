services:
  postgres:
    image: postgres:16-alpine
    container_name: voice-ai-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voice_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voice_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voice-ai-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST_PORT: ${BACKEND_PORT:-3000}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/voice_ai
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voice-ai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      HOST_PORT: ${FRONTEND_PORT:-8080}
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:latest
    container_name: voice-ai-ngrok
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/ngrok-entrypoint.sh"]
    env_file:
      - .env
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env — get it from https://dashboard.ngrok.com/get-started/your-authtoken}
      HOST_PORT: ${NGROK_PORT:-4040}
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
      - ./ngrok/docker-entrypoint.sh:/etc/ngrok-entrypoint.sh:ro
    ports:
      - "${NGROK_PORT:-4040}:4040"
    depends_on:
      - backend

volumes:
  postgres_data:
